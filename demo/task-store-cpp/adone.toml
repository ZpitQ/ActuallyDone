# C++ 演示。cmake / ctest 在 Windows 上由 adone 对上 cmake.exe / ctest.exe。
# --config / -C Release 给 Visual Studio 多配置；Ninja / Makefiles 会忽略它们。

version = 1

[project]
name = "task-store-cpp"
ecosystems = ["cpp"]
state_dir = ".adone"
material_dir = "adone"
skills_dir = ".cursor/skills"

[gate]
watch_roots = ["include", "src", "tests"]
watch_exts = [".cpp", ".cc", ".cxx", ".hpp", ".hh", ".h"]
min_tree_files = 3
keep_receipts = 20

[[gate.step]]
name = "cmake configure"
cwd = "."
argv = ["cmake", "-S", ".", "-B", "build", "-DCMAKE_BUILD_TYPE=Release"]

[[gate.step]]
name = "cmake build"
cwd = "."
argv = ["cmake", "--build", "build", "--config", "Release"]

[[gate.step]]
name = "ctest"
cwd = "."
argv = ["cmake", "-E", "chdir", "build", "ctest", "--output-on-failure", "-V", "-C", "Release"]
kind = "test"
adapter = "cpp"
invalid_marks = []

[coverage]
# MSVC 没有 gcov。GCC/Clang 要覆盖率时自己出 lcov.info，再填下限。
source = "ctest"

[tests]
adapter = "cpp"
roots = ["tests"]
threshold_docs = []

[code]
big_file_lines = 800
big_file_globs = ["src/**/*.cpp", "include/**/*.hpp"]
mark_globs = ["src/**/*.cpp"]
mark_words = ["TODO", "FIXME", "XXX", "HACK"]
dup_min_lines = 8
dup_roots = ["src", "include"]
zero_cover_ratio = 0.15

[docs]
required = ["README.md"]
diagram_globs = []
diagram_render_ext = ".svg"
adr_dir = ""
hooks_file = ""

[requirements]
source = ""
tables_from = ""
routes_from = ""
views_from = ""
