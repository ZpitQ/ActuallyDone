# 场景门禁演示。Java / Go / Python / Node 项目不要抄这份 watch：
# 只有当你真的要盯 skill 文本和 eval 金标时，才把它们加进受监视树。

version = 1

[project]
name = "cs-agent-eval"
ecosystems = []
state_dir = ".adone"
material_dir = "adone"
skills_dir = ".cursor/skills"

[gate]
watch_roots = [".cursor/skills", "adone/eval"]
watch_exts = [".md", ".toml"]
min_tree_files = 5
keep_receipts = 20

[[gate.step]]
name = "skill eval"
cwd = "."
argv = ["python3", "scripts/eval_cs_agent.py"]
kind = "test"
adapter = "eval"
invalid_marks = []

[coverage]
# 场景脚本不产覆盖率，不设下限。
source = "skill eval"

[tests]
adapter = "eval"
roots = ["adone/eval"]
threshold_docs = []

[code]
big_file_lines = 800
big_file_globs = []
mark_globs = []
mark_words = ["TODO", "FIXME", "XXX", "HACK"]
dup_min_lines = 8
dup_roots = []
zero_cover_ratio = 0.15

[docs]
required = ["README.md"]
diagram_globs = []
diagram_render_ext = ".svg"
adr_dir = ""
hooks_file = ""

[requirements]
source = ""
tables_from = ""
routes_from = ""
views_from = ""
